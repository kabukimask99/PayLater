<style>
/* Layout: one narrow column like a phone app. Sticky navy title bar, scrolling content, fixed bottom tab bar, bottom-sheet forms. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#1f2933; --muted:#667382; --line:#e1e6ec;
  --navy:#243b53; --on-navy:#ffffff; --label:#c2410c; --on-label:#ffffff; --tint:#e8f0f7;
  --accent:#ea580c; --on-accent:#ffffff;
  --warn-bg:#fff2cc; --warn-ink:#7c2d12; --ok-bg:#dcfce7; --ok-ink:#166534; --bad-bg:#fee2e2; --bad-ink:#991b1b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --surface:#172230; --ink:#e8eef5; --muted:#9aa8b8; --line:#27374b;
    --navy:#101c2b; --on-navy:#ffffff; --label:#9a3412; --on-label:#ffffff; --tint:#1d3249;
    --accent:#fb923c; --on-accent:#1a1209;
    --warn-bg:#3b2a0a; --warn-ink:#fbbf77; --ok-bg:#12361f; --ok-ink:#86efac; --bad-bg:#3f1519; --bad-ink:#fca5a5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --surface:#172230; --ink:#e8eef5; --muted:#9aa8b8; --line:#27374b;
  --navy:#101c2b; --on-navy:#ffffff; --label:#9a3412; --on-label:#ffffff; --tint:#1d3249;
  --accent:#fb923c; --on-accent:#1a1209;
  --warn-bg:#3b2a0a; --warn-ink:#fbbf77; --ok-bg:#12361f; --ok-ink:#86efac; --bad-bg:#3f1519; --bad-ink:#fca5a5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:40}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:19px;letter-spacing:.14em;font-weight:700}
.top span{font-size:13px;opacity:.8}

main{padding:16px 0 calc(92px + env(safe-area-inset-bottom,0px))}
h2{margin:22px 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.hero{padding:18px 16px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.due{margin-top:6px;font-size:15px;color:var(--muted)}
.big{margin-top:4px;font-size:40px;font-weight:800;letter-spacing:-.02em}
.sub{margin-top:4px;font-size:14px;color:var(--muted)}
.notice{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:14px;font-weight:600;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:12px;overflow:hidden;background:var(--tint);border:1px solid var(--line)}
.tile b{display:block;padding:6px 10px;background:var(--label);color:var(--on-label);font-size:11px;letter-spacing:.04em;font-weight:700}
.tile div{padding:12px 10px;font-size:19px;font-weight:700;text-align:center;overflow-wrap:anywhere}
.foot{margin:18px 2px 0;font-size:12px;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:block;width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.row .l1{display:flex;justify-content:space-between;gap:12px}
.row .l1>div{min-width:0}
.row b{font-weight:700}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.r{text-align:right;flex:none}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.month{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px;font-size:14px;font-weight:700}
.month span{font-weight:600;color:var(--muted);font-size:13px}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.srow .d{font-size:15px;font-weight:700;text-align:center;line-height:1.1}
.srow .d small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.srow .d.od{color:var(--bad-ink)}
.srow .m b{display:block;overflow-wrap:anywhere}
.srow .m small{color:var(--muted);font-size:13px}
.srow .e{text-align:right}
.chip{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.c-ok{background:var(--ok-bg);color:var(--ok-ink)}
.c-part{background:var(--warn-bg);color:var(--warn-ink)}
.c-no{background:var(--bad-bg);color:var(--bad-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;
  min-height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;padding:4px 0;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .back{position:absolute;inset:0;background:rgba(5,10,18,.55)}
.panel{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h3{margin:0 0 14px;font-size:18px}
label{display:block;margin:12px 0 4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{margin-top:6px;font-size:13px;color:var(--muted)}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1 1 120px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.btn.p{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.d{color:var(--bad-ink);background:transparent}
.btn.d[data-armed="1"]{background:var(--bad-ink);color:var(--bad-bg)}
.err{margin-top:10px;color:var(--bad-ink);font-size:14px;font-weight:600}
.empty{padding:28px 18px;text-align:center}
.empty p{margin:0 0 14px;color:var(--muted)}
.empty .btns{justify-content:center}
.setrow{padding:14px;margin-bottom:10px}
.setrow p{margin:6px 0 0;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<script>
(function(){
'use strict';
var KEY='paylater.v1';
var MON=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
var MON3=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];
var PLAT=['Tabung Simpanan','Shopee','Atome','SPayLater','Lain-lain'];
var METHOD=['Online transfer','Tunai','Kad','Tabung Simpanan','Lain-lain'];
var ICON={
  dash:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  items:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  sched:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  pays:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="15" r="1"/>',
  more:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
var TABS=[['dash','Papan'],['items','Barang'],['sched','Jadual'],['pays','Bayaran'],['more','Lagi']];
var S, mem=null, tab='dash', filter='open';

function blank(){return {day:20,seq:1,pseq:1,items:[],pays:[]};}
function load(){
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&Array.isArray(o.items)&&Array.isArray(o.pays)){o.day=o.day||20;o.seq=o.seq||o.items.length+1;o.pseq=o.pseq||o.pays.length+1;return o;}}}catch(e){}
  return mem||blank();
}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function $(s){return document.querySelector(s);}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function iso(y,m0,d){return y+'-'+pad(m0+1)+'-'+pad(d);}
function parse(s){var p=s.split('-');return {y:+p[0],m:+p[1]-1,d:+p[2]};}
function addM(s,n){var p=parse(s),t=p.m+n,y=p.y+Math.floor(t/12),m=((t%12)+12)%12,dim=new Date(y,m+1,0).getDate();return iso(y,m,Math.min(p.d,dim));}
function today(){var t=new Date();return iso(t.getFullYear(),t.getMonth(),t.getDate());}
function fd(s){var p=parse(s);return pad(p.d)+'/'+pad(p.m+1)+'/'+p.y;}
function r2(x){return Math.round((x+1e-9)*100)/100;}
function rm(n){return 'RM '+r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function firstDue(d){var p=parse(d);return addM(iso(p.y,p.m,Math.min(S.day,28)),1);}
function monthLabel(ym){var p=ym.split('-');return MON[+p[1]-1]+' '+p[0];}
function sum(a,f){var t=0;for(var i=0;i<a.length;i++)t+=f(a[i]);return t;}
function findItem(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null;}

/* ---------- Pengiraan (sama seperti fail Excel) ---------- */
function compute(){
  var rows=[];
  S.items.forEach(function(it,idx){
    var term=+it.term,total=r2((+it.price)+(+it.fee||0)),base=r2(total/term);
    var pool=r2(sum(S.pays.filter(function(p){return p.item===it.id;}),function(p){return +p.amount||0;}));
    var first=it.first||firstDue(it.date);
    for(var k=1;k<=term;k++){
      var amt=k<term?base:r2(total-base*(term-1));
      var alloc=Math.max(0,Math.min(amt,r2(pool-base*(k-1))));
      rows.push({item:it,idx:idx,k:k,term:term,date:addM(first,k-1),amt:amt,alloc:alloc,bal:r2(amt-alloc)});
    }
  });
  rows.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.idx-b.idx)||(a.k-b.k);});
  var cum={};
  rows.forEach(function(r){cum[r.item.id]=r2((cum[r.item.id]||0)+r.bal);r.cum=cum[r.item.id];});
  return rows;
}
function stats(rows){
  var st={},open=rows.filter(function(r){return r.bal>0;}),t=today();
  st.up=null;
  if(open.length){
    var ym=open[0].date.slice(0,7);
    st.up={ym:ym,due:ym+'-'+pad(S.day),amt:r2(sum(open.filter(function(r){return r.date.slice(0,7)===ym;}),function(r){return r.bal;}))};
  }
  st.overdue=open.filter(function(r){return r.date<t;}).length;
  st.credit=st.up?r2(sum(rows.filter(function(r){return r.date.slice(0,7)>st.up.ym;}),function(r){return r.alloc;})):0;
  var allocT=sum(rows,function(r){return r.alloc;});
  st.unmatched=r2(sum(S.pays,function(p){return +p.amount||0;})-allocT);
  st.partial=rows.filter(function(r){return r.bal>0&&r.alloc>0;}).length;
  st.buy=sum(S.items,function(i){return +i.price||0;});
  st.due=sum(S.items,function(i){return (+i.price||0)+(+i.fee||0);});
  st.paid=allocT; st.bal=sum(rows,function(r){return r.bal;});
  st.nOpen=open.length; st.nDone=rows.length-open.length;
  if(!st.up) st.msg=st.unmatched>0.005?'NOTIFIKASI: Semua ansuran selesai. Ada lebihan bayaran '+rm(st.unmatched)+' yang tidak dipadankan.':'NOTIFIKASI: Semua ansuran telah selesai.';
  else if(st.overdue>0) st.msg='AMARAN: '+st.overdue+' ansuran sudah lewat. Semak Jadual.';
  else if(st.credit>0.005) st.msg='NOTIFIKASI: Kredit lebihan '+rm(st.credit)+' akan ditolak daripada ansuran seterusnya.';
  else if(st.partial>0) st.msg='NOTIFIKASI: Ada bayaran separa. Semak baki dalam Jadual.';
  else st.msg='NOTIFIKASI: Pastikan bayaran dibuat sebelum atau pada '+S.day+' haribulan.';
  return st;
}

/* ---------- Paparan ---------- */
function tile(l,v){return '<div class="tile"><b>'+esc(l)+'</b><div class="num">'+esc(v)+'</div></div>';}
function emptyCard(text){
  return '<div class="card empty"><p>'+text+'</p><div class="btns"><button class="btn p" data-act="add-item">Tambah barang</button><button class="btn" data-act="sample">Muat data contoh</button></div></div>';
}
function vDash(rows,st){
  if(!S.items.length) return emptyCard('Belum ada barang. Tambah pembelian pertama, atau muat data contoh untuk lihat cara ia berfungsi.');
  var h='<section class="card hero"><div class="eyebrow">UPCOMING BILL</div>';
  if(st.up){var p=parse(st.up.due);h+='<div class="due">Due date '+p.d+' '+MON3[p.m]+' '+p.y+'</div><div class="big num">'+rm(st.up.amt)+'</div><div class="sub">Baki bulan ini: '+rm(st.up.amt)+'</div>';}
  else h+='<div class="due">Semua bil selesai</div><div class="big num">'+rm(0)+'</div><div class="sub">Tiada baki ansuran tertunggak</div>';
  h+='</section><div class="notice" role="status">'+esc(st.msg)+'</div><h2>Ringkasan kewangan</h2><div class="grid">';
  h+=tile('Jumlah Pembelian',rm(st.buy))+tile('Jumlah Perlu Bayar',rm(st.due))+tile('Jumlah Sudah Dibayar',rm(st.paid))+tile('Baki Belum Bayar',rm(st.bal));
  h+=tile('Bil Belum Bayar',String(st.nOpen))+tile('Bil Sudah Bayar',String(st.nDone))+tile('Kredit Bayaran Awal',rm(st.credit))+tile('Lebihan Tidak Dipadankan',rm(Math.max(0,st.unmatched)));
  h+='</div><p class="foot">Upcoming Bill ialah jumlah baki bagi bulan paling awal yang belum selesai. Rekodkan setiap bayaran di tab Bayaran dan paparan ini bergerak sendiri.</p>';
  return h;
}
function vItems(rows){
  if(!S.items.length) return emptyCard('Belum ada barang.');
  var h='<div class="list">';
  S.items.forEach(function(it){
    var total=r2((+it.price)+(+it.fee||0)),base=r2(total/it.term);
    var paid=sum(rows.filter(function(r){return r.item===it;}),function(r){return r.alloc;});
    var pct=total>0?Math.min(100,Math.round(paid/total*100)):0;
    h+='<button class="row" data-act="edit-item" data-id="'+esc(it.id)+'"><div class="l1"><div><b>'+esc(it.name)+'</b><small>'+esc(it.id)+' · '+esc(it.plat||'')+' · '+it.term+' bulan</small></div><div class="r"><b class="num">'+rm(base)+'</b><small>sebulan</small></div></div>'
      +'<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div><small class="num">'+rm(paid)+' daripada '+rm(total)+' ('+pct+'%)</small></button>';
  });
  return h+'</div>';
}
function vSched(rows){
  if(!S.items.length) return emptyCard('Jadual akan muncul selepas anda tambah barang.');
  var h='<div class="chips" role="group" aria-label="Tapis">';
  [['open','Belum selesai'],['done','Sudah bayar'],['all','Semua']].forEach(function(f){h+='<button data-act="filter" data-f="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+'</button>';});
  h+='</div>';
  var vis=rows.filter(function(r){return filter==='all'||(filter==='open'?r.bal>0:r.bal<=0);});
  if(!vis.length) return h+'<div class="card empty" style="margin-top:14px"><p>Tiada ansuran dalam senarai ini.</p></div>';
  var t=today(),cur='';
  vis.forEach(function(r){
    var ym=r.date.slice(0,7);
    if(ym!==cur){cur=ym;var g=vis.filter(function(x){return x.date.slice(0,7)===ym;});
      h+='<div class="month"><div>'+monthLabel(ym)+'</div><span class="num">Baki '+rm(sum(g,function(x){return x.bal;}))+'</span></div>';}
    var p=parse(r.date),od=r.bal>0&&r.date<t;
    var st=r.bal<=0?['Sudah Bayar','c-ok']:(r.alloc>0?['Bayaran Separa','c-part']:['Belum Bayar','c-no']);
    h+='<button class="srow" data-act="pay-row" data-item="'+esc(r.item.id)+'" data-amt="'+r.cum+'"><div class="d num'+(od?' od':'')+'">'+pad(p.d)+'<small>'+MON3[p.m]+'</small></div>'
      +'<div class="m"><b>'+esc(r.item.name)+'</b><small>'+r.k+' / '+r.term+(od?' · lewat':'')+'</small></div>'
      +'<div class="e"><b class="num">'+rm(r.bal>0&&r.alloc>0?r.bal:r.amt)+'</b><br><span class="chip '+st[1]+'">'+st[0]+'</span></div></button>';
  });
  return h;
}
function vPays(){
  if(!S.items.length) return emptyCard('Tambah barang dahulu sebelum merekod bayaran.');
  if(!S.pays.length) return '<div class="card empty"><p>Belum ada bayaran direkod. Tekan "Catat bayaran" setiap kali anda bayar.</p></div>';
  var ps=S.pays.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
  var h='<div class="list">';
  ps.forEach(function(p){
    var it=findItem(p.item);
    h+='<button class="row" data-act="edit-pay" data-id="'+esc(p.id)+'"><div class="l1"><div><b>'+esc(it?it.name:'ID tidak dijumpai')+'</b><small>'+fd(p.date)+' · '+esc(p.item)+(p.method?' · '+esc(p.method):'')+'</small>'+(p.note?'<small>'+esc(p.note)+'</small>':'')+'</div><div class="r"><b class="num">'+rm(+p.amount||0)+'</b></div></div></button>';
  });
  return h+'</div>';
}
function vMore(){
  var d='';for(var i=1;i<=28;i++)d+='<option value="'+i+'"'+(i===S.day?' selected':'')+'>'+i+'</option>';
  return '<div class="card setrow"><label for="set-day" style="margin-top:0">Hari bayaran setiap bulan</label><select id="set-day">'+d+'</select><p>Ansuran pertama jatuh pada bulan selepas tarikh beli, pada hari ini. Perubahan terpakai pada barang yang tiada tarikh ansuran pertama sendiri.</p></div>'
   +'<div class="card setrow"><label for="bk" style="margin-top:0">Sandaran data</label><textarea id="bk" spellcheck="false" aria-describedby="bkh"></textarea>'
   +'<div class="btns"><button class="btn" data-act="copy">Salin data</button><button class="btn" data-act="restore">Pulihkan daripada teks</button></div><p id="bkh">Data disimpan dalam telefon ini sahaja. Salin dan simpan teks di atas di Nota sebagai sandaran. Untuk pindah ke telefon lain, tampal teks itu di sini dan tekan Pulihkan.</p><div id="bkmsg" class="hint" role="status"></div></div>'
   +'<div class="card setrow"><b>Data contoh</b><p>Memuat 3 barang dan beberapa bayaran contoh. Ini menggantikan data semasa.</p><div class="btns"><button class="btn" data-act="sample">Muat data contoh</button><button class="btn d" data-act="wipe">Padam semua data</button></div></div>'
   +'<p class="foot">Tracker peribadi, bukan sistem rasmi mana-mana platform. Caj lewat atau faedah tidak dikira melainkan anda masukkan dalam Caj/Fi.</p>';
}

function render(){
  var rows=compute(),st=stats(rows),v=$('#view'),h='';
  if(tab==='dash')h=vDash(rows,st);else if(tab==='items')h=vItems(rows);else if(tab==='sched')h=vSched(rows);else if(tab==='pays')h=vPays();else h=vMore();
  v.innerHTML=h;
  if(tab==='more'){$('#bk').value=JSON.stringify(S);}
  var t='';TABS.forEach(function(x){t+='<button data-act="tab" data-t="'+x[0]+'"'+(tab===x[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+ICON[x[0]]+'</svg>'+x[1]+'</button>';});
  $('#tabs').innerHTML=t;
  var f='';
  if(tab==='items'&&S.items.length)f='<button class="fab" data-act="add-item">+ Barang</button>';
  if(tab==='pays'&&S.items.length)f='<button class="fab" data-act="add-pay">+ Catat bayaran</button>';
  $('#fabslot').innerHTML=f;
  var d=new Date();$('#sub').textContent=d.getDate()+' '+MON3[d.getMonth()]+' '+d.getFullYear();
}

/* ---------- Borang ---------- */
function openSheet(h){var s=$('#sheet');s.innerHTML='<div class="back" data-act="close"></div><div class="panel" role="dialog" aria-modal="true">'+h+'</div>';s.hidden=false;}
function closeSheet(){var s=$('#sheet');s.hidden=true;s.innerHTML='';}
function opts(arr,sel){return arr.map(function(a){return '<option'+(a===sel?' selected':'')+'>'+esc(a)+'</option>';}).join('');}
function itemForm(id){
  var it=id?findItem(id):null;
  var o=it||{date:today(),name:'',plat:'Tabung Simpanan',price:'',term:6,fee:'',first:'',note:''};
  var terms='';for(var i=1;i<=36;i++)terms+='<option value="'+i+'"'+(+o.term===i?' selected':'')+'>'+i+' bulan</option>';
  var plats=PLAT.indexOf(o.plat)<0&&o.plat?PLAT.concat([o.plat]):PLAT;
  openSheet('<h3>'+(it?'Ubah barang':'Tambah barang')+'</h3><form id="fi" data-id="'+esc(id||'')+'" novalidate>'
   +'<label for="f-name">Nama barang</label><input id="f-name" value="'+esc(o.name)+'" autocomplete="off">'
   +'<div class="two"><div><label for="f-date">Tarikh beli</label><input id="f-date" type="date" value="'+esc(o.date)+'"></div><div><label for="f-plat">Platform</label><select id="f-plat">'+opts(plats,o.plat)+'</select></div></div>'
   +'<div class="two"><div><label for="f-price">Harga (RM)</label><input id="f-price" inputmode="decimal" value="'+esc(o.price)+'" placeholder="0.00"></div><div><label for="f-fee">Caj/Fi (RM)</label><input id="f-fee" inputmode="decimal" value="'+esc(o.fee)+'" placeholder="0.00"></div></div>'
   +'<label for="f-term">Tempoh bayar balik</label><select id="f-term">'+terms+'</select><div class="hint num" id="f-hint"></div>'
   +'<label for="f-first">Tarikh ansuran pertama (kosongkan untuk automatik)</label><input id="f-first" type="date" value="'+esc(o.first||'')+'">'
   +'<label for="f-note">Catatan</label><input id="f-note" value="'+esc(o.note||'')+'">'
   +'<div class="err" id="f-err" role="alert"></div><div class="btns"><button type="button" class="btn" data-act="close">Batal</button>'+(it?'<button type="button" class="btn d" data-act="del-item" data-id="'+esc(id)+'">Padam</button>':'')+'<button type="submit" class="btn p">Simpan</button></div></form>');
  hint();
}
function hint(){
  var p=parseFloat($('#f-price')&&$('#f-price').value),f=parseFloat($('#f-fee').value)||0,t=+$('#f-term').value,h=$('#f-hint');
  if(!h)return;h.textContent=(p>0&&t>0)?'Kira-kira '+rm(r2((p+f)/t))+' sebulan':'';
}
function payForm(id,preset){
  var p=id?S.pays.filter(function(x){return x.id===id;})[0]:null;
  var o=p||{date:today(),item:(preset&&preset.item)||S.items[0].id,amount:(preset&&parseFloat(preset.amount)>0)?preset.amount:'',method:'Online transfer',ref:'',note:''};
  var its=S.items.map(function(i){return '<option value="'+esc(i.id)+'"'+(i.id===o.item?' selected':'')+'>'+esc(i.id)+' · '+esc(i.name)+'</option>';}).join('');
  var mets=METHOD.indexOf(o.method)<0&&o.method?METHOD.concat([o.method]):METHOD;
  openSheet('<h3>'+(p?'Ubah bayaran':'Catat bayaran')+'</h3><form id="fp" data-id="'+esc(id||'')+'" novalidate>'
   +'<label for="p-item">Barang</label><select id="p-item">'+its+'</select>'
   +'<div class="two"><div><label for="p-date">Tarikh bayar</label><input id="p-date" type="date" value="'+esc(o.date)+'"></div><div><label for="p-amt">Jumlah (RM)</label><input id="p-amt" inputmode="decimal" value="'+esc(o.amount)+'" placeholder="0.00"></div></div>'
   +'<label for="p-met">Kaedah bayaran</label><select id="p-met">'+opts(mets,o.method)+'</select>'
   +'<label for="p-ref">Rujukan transaksi</label><input id="p-ref" value="'+esc(o.ref||'')+'">'
   +'<label for="p-note">Catatan</label><input id="p-note" value="'+esc(o.note||'')+'">'
   +'<div class="err" id="f-err" role="alert"></div><div class="btns"><button type="button" class="btn" data-act="close">Batal</button>'+(p?'<button type="button" class="btn d" data-act="del-pay" data-id="'+esc(id)+'">Padam</button>':'')+'<button type="submit" class="btn p">Simpan</button></div></form>');
}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?NaN:n;}
function submitItem(f){
  var id=f.getAttribute('data-id'),name=$('#f-name').value.trim(),date=$('#f-date').value,price=num($('#f-price').value),fee=$('#f-fee').value.trim()===''?0:num($('#f-fee').value),term=+$('#f-term').value;
  var e=$('#f-err');
  if(!name){e.textContent='Isi nama barang.';return;}
  if(!date){e.textContent='Pilih tarikh beli.';return;}
  if(!(price>0)){e.textContent='Isi harga yang lebih daripada 0.';return;}
  if(isNaN(fee)||fee<0){e.textContent='Caj/Fi mesti nombor 0 atau lebih.';return;}
  var rec={name:name,date:date,plat:$('#f-plat').value,price:r2(price),fee:r2(fee),term:term,first:$('#f-first').value,note:$('#f-note').value.trim()};
  if(id){var it=findItem(id);for(var k in rec)it[k]=rec[k];}
  else{rec.id='PL-'+('00'+S.seq++).slice(-3);S.items.push(rec);}
  save();closeSheet();render();
}
function submitPay(f){
  var id=f.getAttribute('data-id'),amt=num($('#p-amt').value),date=$('#p-date').value,e=$('#f-err');
  if(!date){e.textContent='Pilih tarikh bayar.';return;}
  if(!(amt>0)){e.textContent='Isi jumlah yang lebih daripada 0.';return;}
  var rec={date:date,item:$('#p-item').value,amount:r2(amt),method:$('#p-met').value,ref:$('#p-ref').value.trim(),note:$('#p-note').value.trim()};
  if(id){var p=S.pays.filter(function(x){return x.id===id;})[0];for(var k in rec)p[k]=rec[k];}
  else{rec.id='B'+(S.pseq++);S.pays.push(rec);}
  save();closeSheet();render();
}
function sample(){
  var t=new Date(),y=t.getFullYear(),m=t.getMonth(),buy=addM(iso(y,m,12),-2),d1=addM(iso(y,m,19),-1),d2=iso(y,m,1);
  S=blank();S.seq=4;
  S.items=[
    {id:'PL-001',date:buy,name:'Telefon (contoh)',plat:'Tabung Simpanan',price:1800,term:12,fee:0,first:'',note:''},
    {id:'PL-002',date:buy,name:'Kasut sukan (contoh)',plat:'Tabung Simpanan',price:250,term:3,fee:0,first:'',note:''},
    {id:'PL-003',date:buy,name:'Laptop (contoh)',plat:'Tabung Simpanan',price:3600,term:36,fee:0,first:'',note:'Contoh 36 bulan'}];
  S.pays=[
    {id:'B1',date:d1,item:'PL-001',amount:150,method:'Online transfer',ref:'',note:'Contoh'},
    {id:'B2',date:d1,item:'PL-002',amount:83.33,method:'Online transfer',ref:'',note:'Contoh'},
    {id:'B3',date:d1,item:'PL-003',amount:250,method:'Online transfer',ref:'',note:'Contoh: lebih RM150, ditolak daripada ansuran seterusnya'},
    {id:'B4',date:d2,item:'PL-001',amount:100,method:'Online transfer',ref:'',note:'Contoh: bayaran separa'}];
  S.pseq=5;save();
}

/* ---------- Acara ---------- */
document.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='tab'){tab=b.getAttribute('data-t');render();window.scrollTo(0,0);}
  else if(a==='filter'){filter=b.getAttribute('data-f');render();}
  else if(a==='close')closeSheet();
  else if(a==='add-item')itemForm(null);
  else if(a==='edit-item')itemForm(b.getAttribute('data-id'));
  else if(a==='add-pay')payForm(null);
  else if(a==='edit-pay')payForm(b.getAttribute('data-id'));
  else if(a==='pay-row')payForm(null,{item:b.getAttribute('data-item'),amount:b.getAttribute('data-amt')});
  else if(a==='sample'){sample();tab='dash';render();}
  else if(a==='del-item'||a==='del-pay'||a==='wipe'){
    if(b.getAttribute('data-armed')!=='1'){b.setAttribute('data-armed','1');b.textContent='Tekan sekali lagi untuk padam';return;}
    if(a==='del-item'){var id=b.getAttribute('data-id');S.items=S.items.filter(function(i){return i.id!==id;});S.pays=S.pays.filter(function(p){return p.item!==id;});}
    else if(a==='del-pay'){var pid=b.getAttribute('data-id');S.pays=S.pays.filter(function(p){return p.id!==pid;});}
    else S=blank();
    save();closeSheet();render();
  }
  else if(a==='copy'){
    var ta=$('#bk'),m=$('#bkmsg');
    function sel(){ta.focus();ta.select();m.textContent='Teks dipilih. Tekan lama dan pilih Salin.';}
    try{navigator.clipboard.writeText(ta.value).then(function(){m.textContent='Data disalin.';},sel);}catch(e){sel();}
  }
  else if(a==='restore'){
    var m2=$('#bkmsg');
    try{var o=JSON.parse($('#bk').value);if(!o||!Array.isArray(o.items)||!Array.isArray(o.pays))throw 0;
      o.day=o.day||20;o.seq=o.seq||o.items.length+1;o.pseq=o.pseq||o.pays.length+1;S=o;save();render();$('#bkmsg').textContent='Data dipulihkan.';}
    catch(e){m2.textContent='Teks tidak sah. Tampal teks sandaran yang lengkap.';}
  }
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();var f=ev.target;
  if(f.id==='fi')submitItem(f);else if(f.id==='fp')submitPay(f);
});
document.addEventListener('input',function(ev){if(ev.target.id==='f-price'||ev.target.id==='f-fee')hint();});
document.addEventListener('change',function(ev){
  if(ev.target.id==='f-term')hint();
  if(ev.target.id==='set-day'){S.day=+ev.target.value;save();}
});

S=load();render();
})();
</script>

</body>
</html>
